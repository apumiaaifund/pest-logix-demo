<!DOCTYPE html><html><body style="font-family:sans-serif;background:#090d16;color:#f1f5f9;max-width:720px;margin:0 auto;padding:28px"><h1>PestLogix — US EPA FIFRA & Termite Bond Calculator</h1><label>Area (sq ft):</label><input id="sq" type="number" value="5000"><br><label>Max Rate (oz/1000 sq ft):</label><input id="rt" type="number" step="0.1" value="1.5"><br><label>Applied (oz):</label><input id="ap" type="number" step="0.1" value="9.0"><br><label>Expiring Bonds:</label><input id="bd" type="number" value="12"><br><button onclick="r.textContent=`Max: ${(+sq.value*0.001*+rt.value).toFixed(2)} oz | Over: ${Math.max(0,+ap.value-+sq.value*0.001*+rt.value).toFixed(2)} oz | Bond Pipeline: $${(+bd.value*295).toLocaleString()}.00`">Audit FIFRA</button><pre id="r" style="color:#38bdf8"></pre></body></html>
